name: CI

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.25.4
      - name: Install dependencies
        run: apt update && apt install -y alsa-lib
      - name: build
        run: go build .
      - name: test
        run: go test -v ./...
